[project]
name = "idiolect-engine"
version = "0.2.0"
description = "Idiolect's local speech engine: Qwen3-TTS voice cloning and faster-whisper reading."
requires-python = ">=3.12,<3.13"
dependencies = [
  "qwen-tts==0.1.1",
  # PyPI wheels use CUDA 12.8 on Linux and Metal (MPS) on Apple silicon.
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
  "soundfile>=0.13,<1",
  "numpy>=1.26,<3",
  "scipy>=1.15,<2",
  "huggingface-hub>=0.34,<1",
  "pydantic>=2.11,<3",
  "faster-whisper>=1.2,<2",
  # faster-whisper 1.2 uses metadata_errors, removed by PyAV 19.
  "av>=11,<19",
]

[project.scripts]
idiolect-engine = "idiolect_engine.runtime:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idiolect_engine"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
